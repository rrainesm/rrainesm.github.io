<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Gen AI Package</title>
    <style>
         body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url(genai.png);
            background-size: cover;
            background-position: top;
            background-repeat: no-repeat;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            overflow: hidden;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007BFF;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
            animation: pulse 2s infinite;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .iframe{
                width: 960px;
                height: 540px;
                aspect-ratio: 16/9;
                border:none;
                background-color: aliceblue;
                overflow:hidden;
                display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            
        }

        .header {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 1600px;
            animation: fadeInUp 1.5s ease-out;
        }
        #overlay{
                background:rgba(0,0,0,0.6);
                width:100vw;
                height:100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                position:absolute;
                top:-100vh;
            }
            #overlay div{
                text-align: center;
                color: whitesmoke;
            }
            
            @media only screen 
    and (min-device-width: 375px) 
    and (orientation: portrait) { 
       /*show rotate overlay icon*/
        #overlay {
            top:0;
        }
    }
    @media only screen 
    and (max-width: 767px) and (orientation: landscape) { 
        #container{
            transform:scale(.6);
        }
    }
    @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }
        @keyframes pulse {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.05);
    }
    100% {
        transform: scale(1);
    }
}
    </style>
</head>
<body>
    <div class="iframe">
    <div class="header">
        <h1>Discover Generative AI</h1>
        <p>An IMDA initiative.</p>
    <a href="intro.html" class="button">Learn About Generative AI</a>
</div>

        c0,9.686,2.068,19.001,6.148,27.688l-27.154,12.754c-5.968-12.707-8.994-26.313-8.994-40.441C11.964,42.716,54.68,0,107.184,0
        S202.403,42.716,202.403,95.22z"></path>
    </svg><h1>Please rotate your screen</h1></div></div>
</body>
</html>
