<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gen AI Certificate</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            overflow: hidden;
        }


        .section {
            margin-bottom: 40px;
            width: 80%;
            text-align: center;
            display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; 
        }

        .iframe{
                width: 960px;
                height: 540px;
                aspect-ratio: 16/9;
                border:none;
                background-color: aliceblue;
                overflow:hidden;
                display: flex;        
             justify-content: center; 
                 align-items: center;    
}
        h1 {
            color: white;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 10px;
            height: 60px;
            width: 600px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .certificate-container {
            width: 800px;
            height: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 5px;
            margin: 0 auto;
            margin-top: 5px;
            margin-bottom: auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .certificate-image {
            width: 550px;   
            height: 350px;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #6366f1;
        }

        .next-btn {
            padding: 10px 20px;
            border: 2px solid #6366f1;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
            margin-top: 30px; 
            margin-left: 50px;
            margin-right: 20px;
             display: inline-block; 
            text-decoration: none;
        }

        .next-btn:hover {
            background: #6366f1;
            color: white;
        }

        
    </style>
</head>
<body>
        <div class="iframe"> 
    <div class="section">
        <h1>Your Certificate of Completion</h1>

        <div class="certificate-container">
            <div class="certificate-image">
                <img src="cert.png" width="100%" height="100%" alt="Certificate">
            </div>
            <a href="conclusion.html" class="next-btn">Back to conclusion</a>
        </div>



 
</body>
</html>
